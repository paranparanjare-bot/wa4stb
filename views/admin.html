<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Panel - WA-STB</title>
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WA-STB">
    <link rel="manifest" href="/manifest.json">
    <style>
        body{background:#0f172a;color:#f8fafc;font-family:sans-serif;margin:0;padding:10px;box-sizing:border-box}
        .container{max-width:600px;margin:auto}
        .card{background:#1e293b;padding:15px;border-radius:10px;margin-bottom:15px}
        .sticky-header{position:sticky;top:0;background:#0f172a;padding:15px;z-index:10;border-radius:10px;margin:0}
        h2,h3{margin-top:0;color:#38bdf8}
        input,select,textarea{width:100%;padding:8px;margin:5px 0;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:6px;box-sizing:border-box}
        button{padding:8px 12px;background:#3b82f6;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:5px}
        button.danger{background:#ef4444}button.success{background:#10b981}button:disabled{background:#475569;cursor:not-allowed}
        .flex{display:flex;gap:8px;flex-wrap:wrap}
        .small{font-size:12px;color:#94a3b8}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:999}
        .modal.active{display:flex}
        .modal-content{background:#1e293b;padding:20px;border-radius:10px;max-width:95%;max-height:90%;overflow:auto}
    </style>
</head>
<body>
    <div class="container">
        <!-- Bot Control -->
        <div class="card">
            <h2 class="h2">WA-STB Admin Panel</h2>
            <div class="status">Status WA: <b id="waStatus">STATUS_DISPLAY</b></div>
            <div class="flex" style="gap:6px"><form method="POST" action="/admin/start" style="flex:1"><button class="success" DISABLE_START style="width:100%;padding:6px;font-size:12px">Start</button></form><form method="POST" action="/admin/stop" style="flex:1"><button class="danger" DISABLE_STOP style="width:100%;padding:6px;font-size:12px">Stop</button></form><button class="danger" onclick="showQrModal()" style="flex:1;padding:6px;font-size:12px">QR</button><form method="POST" action="/admin/reset-session"><button class="danger" style="padding:6px;font-size:12px">Reset</button></form></div>
        </div>

        <!-- QR Modal -->
        <div id="qrModal" class="modal"><div class="modal-content"><h3>QR Code WhatsApp</h3><div id="qrContent">QR_CONTENT</div><button onclick="closeQrModal()" style="margin-top:15px;">Tutup</button></div></div>

        <!-- AI Gateway Config -->
        <div class="card"><h3>AI Gateway Config</h3><div class="small">Gateway URL:</div><input id="aiUrl" value="AI_URL"><div class="small">API Key:</div><input id="aiKey" type="password" value="AI_KEY"><div class="small">Model:</div><input id="aiModel" value="AI_MODEL"><button onclick="saveAi()">Simpan AI Config</button></div>

        <!-- License -->
        <div class="card"><h3>Lisensi</h3><div class="small">Status: LIC_STATUS</div><div class="lic-card"><div class="small">License Key:</div><input id="licKey" value="LIC_KEY"><div class="small" style="margin-top:6px">LIC_INFO</div><div style="margin-top:10px"><button onclick="saveLic()">Aktifkan</button><button class="danger" style="margin-left:8px" onclick="revokeLic()">Logout</button></div></div></div>

        <!-- Edit Knowledge Base -->
        <div class="card"><h3>Edit Knowledge Base</h3><select id="kb" onchange="loadKb()"><option value="">-- Pilih File KB --</option>KB_OPTIONS</select><textarea id="kbContent" rows="12" placeholder="Pilih file di atas..."></textarea><button onclick="saveKb()">Simpan KB</button></div>

        <!-- Ganti Password (paling bawah) -->
        <div class="card"><h3>Ganti Password Admin</h3><input id="p1" type="password" placeholder="Password Lama"><input id="p2" type="password" placeholder="Password Baru"><button onclick="savePwd()">Simpan Password</button></div>

        <div class="card" style="text-align:center"><a href="/admin/logout" style="color:#ef4444;text-decoration:none;font-weight:bold">Logout</a></div>
    </div>

    <script>
        async function loadKb(){const f=document.getElementById('kb').value;if(!f){document.getElementById('kbContent').value='';return}const r=await fetch('/admin/kb/get/'+f);const d=await r.json();document.getElementById('kbContent').value=d.content||''}
        async function savePwd(){const o=document.getElementById('p1').value,n=document.getElementById('p2').value;if(!o||!n){alert('Isi kedua field');return}const r=await fetch('/admin/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword:o,newPassword:n})});alert((await r.json()).message)}
        async function saveKb(){const f=document.getElementById('kb').value,c=document.getElementById('kbContent').value;if(!f){alert('Pilih file dulu');return}const r=await fetch('/admin/kb/'+f,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:c})});alert((await r.json()).message)}
        async function saveAi(){const u=document.getElementById('aiUrl').value,k=document.getElementById('aiKey').value,m=document.getElementById('aiModel').value;const r=await fetch('/admin/config/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aiUrl:u,apiKey:k,model:m})});alert((await r.json()).message)}
        async function saveLic(){const key=document.getElementById('licKey').value.trim();if(!key){alert('Masukkan kode lisensi');return}const r=await fetch('/admin/auth/activate-license',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});const d=await r.json();alert(d.message);if(d.success)location.reload()}
        async function revokeLic(){if(!confirm('Logout lisensi dari perangkat ini?'))return;const r=await fetch('/admin/auth/revoke-license',{method:'POST'});const d=await r.json();alert(d.message);location.reload()}
        function showQrModal(){document.getElementById('qrModal').classList.add('active')}
        function closeQrModal(){document.getElementById('qrModal').classList.remove('active')}
        if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}
    </script>
</body>
</html>
